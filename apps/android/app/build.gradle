plugins {
    id "com.android.application"
}

android {
    namespace "com.agentbeacon.android"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.agentbeacon.android"
        minSdk 26
        targetSdk 36
        versionCode 16
        versionName "0.1.15"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            // Keep the generated development key inside the workspace-local cache, never under C:\Users.
            def existingDevelopmentKey = rootProject.file("../../.cache/android/debug.keystore")
            if (existingDevelopmentKey.exists()) storeFile existingDevelopmentKey
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}

dependencies {
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "androidx.core:core:1.6.0"
    implementation "androidx.fragment:fragment:1.3.6"
}
